<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Se Registrar</title>

    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=visibility,visibility_off"
    />
  </head>
  <body>
    <form action="">
    <div id="headerFormdiv">
        <header id="headerForm">
            <h1>Registrar</h1>
        </header>
    </div>
      <div id="nomeUserdiv">
        <label for="nomeUser">Nome completo</label>
        <input
          type="text"
          name="nomeUser"
          id="nomeUser"
          placeholder="Fulano D. Tao"
        />
      </div>

      <div id="emailUserdiv">
        <label for="emailUser">Email</label>
        <input
          type="email"
          name="emailUser"
          id="emailUser"
          placeholder="Fulano@teste.com"
        />
      </div>

      <div id="idadeUserdiv">
        <label for="idadeUser">Idade</label>
        <input
          type="date"
          name="idadeUser"
          id="idadeUser"
          placeholder="Fulano@teste.com"
          min="10"
        />
      </div>

      <div id="senhaUserdiv">
        <div id="labelsenhaUser">
          <label for="senhaUser">Senha</label>
          <span
            onclick="passwordAlter()"
            id="btnPassword"
            class="material-symbols-outlined"
            style="cursor: pointer;"
            >visibility_off</span
          >
        </div>
        <input type="password" name="senhaUser" id="senhaUser" min="10" show />
      </div>

      <div id="submitDiv">
        <button type="submit">Registrar</button>
      </div>
    </form>


    
  </body>
</html>

<script>
  const btnPassword = document.getElementById("btnPassword");
  const senhaUser = document.getElementById("senhaUser");
  function passwordAlter() {
    if (senhaUser.type == "password") {
      senhaUser.type = "text";
      btnPassword.textContent = "visibility";
    } else {
      senhaUser.type = "password";
      btnPassword.textContent = "visibility_off";
    }
  }
</script>

  }


  
  #headerFormdiv{
    background-color: hsl(0, 65%, 65%);

  input {
